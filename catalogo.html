<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo Mayorista · Optiline</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <style>
    /* Header Tools: Carrito + Mi Cuenta + Llave Admin */
    .header-tools { display: flex; align-items: center; gap: 0.85rem; margin-left: 1.5rem; }
    
    .btn-carrito-toggle {
      background: none;
      border: none;
      cursor: pointer;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gris-900);
      padding: 0.4rem;
      transition: transform 0.2s;
    }
    .btn-carrito-toggle:hover { transform: scale(1.1); color: var(--azul); }
    .btn-carrito-toggle svg { width: 24px; height: 24px; }
    
    .carrito-badge {
      position: absolute;
      top: -3px;
      right: -3px;
      background: var(--naranja);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 800;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-admin-key {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gris-700);
      padding: 0.4rem;
      border-radius: 50%;
      transition: all 0.2s;
    }
    .btn-admin-key:hover { color: var(--naranja); background: #fef3c7; }
    .btn-admin-key svg { width: 22px; height: 22px; }

    /* Drawer Lateral del Carrito */
    .cart-drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 999;
      display: none;
    }
    .cart-drawer-backdrop.activo { display: block; }

    .cart-drawer {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: 100%; max-width: 420px;
      background: #fff;
      z-index: 1000;
      box-shadow: -4px 0 15px rgba(0,0,0,0.15);
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
    }
    .cart-drawer.activo { transform: translateX(0); }

    .cart-drawer__header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--gris-200);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cart-drawer__header h3 { font-family: var(--fuente-titulos); font-size: 1.15rem; font-weight: 800; }
    
    .cart-drawer__body { flex-grow: 1; overflow-y: auto; padding: 1.5rem; }
    .cart-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1rem;
      padding-bottom: 1rem;
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--gris-200);
    }
    .cart-item h4 { font-family: var(--fuente-titulos); font-size: 0.95rem; font-weight: 700; }
    .cart-item p { font-size: 0.8rem; color: var(--gris-700); }

    .cart-drawer__footer {
      padding: 1.5rem;
      border-top: 1px solid var(--gris-200);
      background: var(--gris-100);
    }
    .cart-total-row { display: flex; justify-content: space-between; font-size: 1.15rem; font-weight: 800; margin-bottom: 1rem; }

    /* Modal Selección de Unidades */
    .modal-units-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }
    .modal-units-backdrop.activo { display: flex; }
    .modal-units-box {
      background: #fff;
      border-radius: 8px;
      max-width: 480px;
      width: 100%;
      padding: 2rem;
    }
  </style>
</head>
<body>

  <!-- ================= HEADER COMPLETO ================= -->
  <header class="header">
    <div class="contenedor header__inner">
      <a href="index.html" class="logo">
        <img src="img/logo.png" alt="Optiline" class="logo__img">
      </a>

      <nav class="nav">
        <ul class="nav__lista">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="catalogo.html" class="activo">Catálogo</a></li>
          <li><a href="cuenta.html?tab=pagos" style="color:var(--naranja); font-weight:700;">Notificación de pago</a></li>
        </ul>
      </nav>

      <!-- HERRAMIENTAS: CARRITO + MI CUENTA + LLAVE ADMIN -->
      <div class="header-tools">
        <!-- 1. Carrito a la izquierda -->
        <button type="button" class="btn-carrito-toggle" id="btn-abrir-carrito" aria-label="Ver Carrito">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/>
            <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>
          </svg>
          <span class="carrito-badge" id="cart-counter">0</span>
        </button>

        <!-- 2. Botón Mi Cuenta en el centro -->
        <a href="cuenta.html" id="nav-btn-cuenta" class="boton boton--primario" style="padding:0.45rem 1.25rem;">Mi Cuenta</a>

        <!-- 3. Icono Llave Admin a la derecha -->
        <a href="admin.html" class="btn-admin-key" title="Panel Administrativo" aria-label="Acceso Administrador">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4"/>
            <path d="m21 2-9.6 9.6"/>
            <circle cx="7.5" cy="15.5" r="5.5"/>
          </svg>
        </a>
      </div>
    </div>
  </header>

  <!-- BANNER CATÁLOGO -->
  <section class="banner-pagina">
    <div class="contenedor">
      <h1 class="banner-pagina__titulo">Catálogo de Productos</h1>
      <div class="migas">
        <a href="index.html">Inicio</a>
        <span>/</span>
        <span>Catálogo Mayorista</span>
      </div>
    </div>
  </section>

  <!-- CATÁLOGO PRINCIPAL -->
  <main class="seccion">
    <div class="contenedor">
      <div class="catalogo-toolbar">
        <div class="catalogo-toolbar__right" id="txt-total-productos">Cargando inventario real...</div>
        <select class="catalogo-select" id="select-filtro-categoria">
          <option value="">Todas las Categorías</option>
        </select>
      </div>

      <!-- Cuadrícula Dinámica -->
      <div class="grid-catalogo-productos" id="grid-catalogo"></div>
    </div>
  </main>

  <!-- DRAWER DEL CARRITO -->
  <div class="cart-drawer-backdrop" id="cart-backdrop"></div>
  <aside class="cart-drawer" id="cart-drawer">
    <div class="cart-drawer__header">
      <h3>Orden de Pedido</h3>
      <button type="button" id="btn-cerrar-carrito" style="background:none; border:none; font-size:1.5rem; cursor:pointer;">&times;</button>
    </div>
    <div class="cart-drawer__body" id="cart-items-container">
      <p style="text-align:center; color:#9ca3af; margin-top:3rem;">Tu carrito está vacío.</p>
    </div>
    <div class="cart-drawer__footer">
      <div class="cart-total-row">
        <span>Total Estimado:</span>
        <span id="cart-total">$0.00</span>
      </div>
      <button type="button" class="boton boton--naranja boton--bloque" id="btn-confirmar-pedido">Confirmar y Generar Orden</button>
    </div>
  </aside>

  <!-- MODAL: SELECCIÓN DE VARIANTE Y UNIDADES REALES -->
  <div class="modal-units-backdrop" id="modal-units">
    <div class="modal-units-box">
      <h3 id="modal-prod-nombre" style="font-family:var(--fuente-titulos); font-size:1.2rem; font-weight:800; margin-bottom:0.4rem;"></h3>
      <p id="modal-prod-desc" style="font-size:0.85rem; color:var(--gris-700); margin-bottom:1.25rem;"></p>

      <form id="form-add-to-cart">
        <div class="campo">
          <label>Fórmula / Graduación Disponible:</label>
          <select id="modal-select-variante" style="width:100%; padding:0.75rem; border:1px solid var(--gris-200); border-radius:6px;" required>
            <option value="">Selecciona graduación...</option>
          </select>
        </div>

        <div class="campo" style="margin-top:1rem;">
          <label>Cantidad a Ordenar:</label>
          <div style="display:flex; align-items:center; gap:1rem;">
            <input type="number" id="modal-cantidad" min="1" value="1" style="width:120px; padding:0.75rem; border:1px solid var(--gris-200); border-radius:6px;" required>
            <span id="modal-stock-info" style="font-size:0.85rem; font-weight:700; color:var(--azul);"></span>
          </div>
        </div>

        <div style="display:flex; gap:0.75rem; margin-top:2rem;">
          <button type="submit" class="boton boton--primario boton--bloque" id="btn-modal-add">Añadir al Pedido</button>
          <button type="button" class="boton boton--contorno" id="btn-modal-cancel" style="border-color:var(--gris-400); color:var(--gris-900);">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- SCRIPT SUPABASE + CARRITO -->
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const SUPABASE_URL = 'https://fdkdzyjrrtuaotiumbym.supabase.co'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZka2R6eWpycnR1YW90aXVtYnltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0MDc1MzAsImV4cCI6MjEwNjk4MzUzMH0.RC_ueLB8le0c95RMemtkQf4Yj-bFTrfYLaAcbdRDbXs'
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    const $ = (s) => document.querySelector(s)

    // Estado del Carrito Local
    let carrito = JSON.parse(localStorage.getItem('optiline_cart') || '[]')
    let catalogoProductos = []
    let inventarioReal = []

    // Detectar Óptica Logueada
    const clienteActivo = JSON.parse(localStorage.getItem('optiline_cliente') || 'null')
    if (clienteActivo) {
      $('#nav-btn-cuenta').textContent = clienteActivo.empresa || 'Mi Cuenta'
    }

    actualizarBadgeCarrito()

    // Cargar Catálogo e Inventario de Supabase
    async function inicializarCatalogo() {
      // 1. Obtener Categorías
      const { data: cats } = await supabase.from('categorias').select('*').order('nombre')
      $('#select-filtro-categoria').innerHTML = '<option value="">Todas las Categorías</option>' + (cats || []).map(c => `<option value="${c.id}">${c.nombre}</option>`).join('')

      // 2. Obtener Productos
      const { data: prods } = await supabase.from('productos').select('*, categorias(nombre)').order('id')
      catalogoProductos = prods || []

      // 3. Obtener Inventario y Stock Real
      const { data: inv } = await supabase.from('inventario_lotes').select('id, stock, precio, variante_id, variantes(id, nombre, producto_id), lotes(codigo_lote, fecha_vencimiento)')
      inventarioReal = inv || []

      renderCatalogo()
    }

    function renderCatalogo() {
      const cId = $('#select-filtro-categoria').value
      const filtrados = catalogoProductos.filter(p => !cId || p.categoria_id == cId)

      $('#txt-total-productos').textContent = `Mostrando ${filtrados.length} productos disponibles`

      $('#grid-catalogo').innerHTML = filtrados.map(p => {
        // Calcular stock total sumando todas sus fórmulas reales
        const itemsInv = inventarioReal.filter(i => i.variantes?.producto_id === p.id)
        const stockTotal = itemsInv.reduce((sum, item) => sum + (item.stock || 0), 0)
        const tieneStock = stockTotal > 0

        return `
          <article class="catalogo-producto">
            <div class="catalogo-producto__media">
              ${p.imagen_url ? `<img src="${p.imagen_url}" alt="${p.nombre}">` : '<div style="height:100%; display:grid; place-items:center; color:#9ca3af;">Sin imagen</div>'}
            </div>
            <div class="catalogo-producto__cuerpo">
              <h3 class="catalogo-producto__titulo">${p.nombre}</h3>
              <p class="catalogo-producto__precio-desc">${p.categorias?.nombre || 'General'}</p>
              
              <div style="margin: 0.5rem 0;">
                ${tieneStock ? `
                  <span style="font-size:0.82rem; font-weight:700; color:#03543f; background:#def7ec; padding:0.2rem 0.5rem; border-radius:4px;">
                    Stock disponible: ${stockTotal} unids
                  </span>
                ` : `
                  <span style="font-size:0.82rem; font-weight:700; color:#991b1b; background:#fee2e2; padding:0.2rem 0.5rem; border-radius:4px;">
                    Agotado (0 unidades)
                  </span>
                `}
              </div>

              <div class="catalogo-producto__precio">$${Number(p.precio || 0).toFixed(2)}</div>
            </div>

            <button type="button" 
              class="catalogo-producto__opciones ${tieneStock ? 'catalogo-producto__opciones--destacado' : ''}" 
              data-abrir-prod="${p.id}"
              ${!tieneStock ? 'disabled style="opacity:0.5; cursor:not-allowed;"' : ''}>
              ${tieneStock ? 'Seleccionar Unidades' : 'Sin Stock'}
            </button>
          </article>
        `
      }).join('')

      // Eventos de botones
      document.querySelectorAll('[data-abrir-prod]').forEach(btn => {
        btn.addEventListener('click', () => {
          const pId = parseInt(btn.dataset.abrirProd)
          abrirModalUnidades(pId)
        })
      })
    }

    $('#select-filtro-categoria').addEventListener('change', renderCatalogo)

    // ================= MODAL SELECCIÓN DE VARIANTE =================
    let productoActualModal = null
    let itemsDisponiblesModal = []

    function abrirModalUnidades(pId) {
      productoActualModal = catalogoProductos.find(p => p.id === pId)
      if (!productoActualModal) return

      itemsDisponiblesModal = inventarioReal.filter(i => i.variantes?.producto_id === pId && i.stock > 0)

      $('#modal-prod-nombre').textContent = productoActualModal.nombre
      $('#modal-prod-desc').textContent = productoActualModal.descripcion || 'Selecciona la graduación y cantidad para tu orden.'

      $('#modal-select-variante').innerHTML = '<option value="">Selecciona graduación...</option>' +
        itemsDisponiblesModal.map(i => `
          <option value="${i.id}" data-stock="${i.stock}" data-precio="${i.precio || productoActualModal.precio}">
            ${i.variantes?.nombre} (Lote: ${i.lotes?.codigo_lote} | Disp: ${i.stock} unids)
          </option>
        `).join('')

      $('#modal-cantidad').value = '1'
      $('#modal-stock-info').textContent = ''
      $('#modal-units').classList.add('activo')
    }

    $('#modal-select-variante').addEventListener('change', (e) => {
      const opt = e.target.selectedOptions[0]
      if (opt && opt.value) {
        const stockMax = parseInt(opt.dataset.stock)
        $('#modal-cantidad').max = stockMax
        $('#modal-stock-info').textContent = `Máximo disponible: ${stockMax} unids`
      } else {
        $('#modal-stock-info').textContent = ''
      }
    })

    $('#btn-modal-cancel').addEventListener('click', () => $('#modal-units').classList.remove('activo'))

    $('#form-add-to-cart').addEventListener('submit', (e) => {
      e.preventDefault()
      const invId = parseInt($('#modal-select-variante').value)
      const cant = parseInt($('#modal-cantidad').value)
      const itemInv = itemsDisponiblesModal.find(i => i.id === invId)

      if (!itemInv || cant <= 0 || cant > itemInv.stock) {
        alert('Por favor selecciona una variante válida y cantidad en existencia.')
        return
      }

      const precioUnit = parseFloat(itemInv.precio || productoActualModal.precio || 0)

      carrito.push({
        invId: itemInv.id,
        productoId: productoActualModal.id,
        nombre: productoActualModal.nombre,
        variante: itemInv.variantes?.nombre,
        lote: itemInv.lotes?.codigo_lote,
        cantidad: cant,
        precio: precioUnit,
        subtotal: cant * precioUnit
      })

      localStorage.setItem('optiline_cart', JSON.stringify(carrito))
      actualizarBadgeCarrito()
      $('#modal-units').classList.remove('activo')
      abrirDrawerCarrito()
    })

    // ================= CARRITO Y DRAWER =================
    function actualizarBadgeCarrito() {
      const totalUnidades = carrito.reduce((sum, item) => sum + item.cantidad, 0)
      $('#cart-counter').textContent = totalUnidades
    }

    function abrirDrawerCarrito() {
      $('#cart-backdrop').classList.add('activo')
      $('#cart-drawer').classList.add('activo')
      renderItemsCarrito()
    }

    function cerrarDrawerCarrito() {
      $('#cart-backdrop').classList.remove('activo')
      $('#cart-drawer').classList.remove('activo')
    }

    $('#btn-abrir-carrito').addEventListener('click', abrirDrawerCarrito)
    $('#btn-cerrar-carrito').addEventListener('click', cerrarDrawerCarrito)
    $('#cart-backdrop').addEventListener('click', cerrarDrawerCarrito)

    function renderItemsCarrito() {
      if (!carrito.length) {
        $('#cart-items-container').innerHTML = '<p style="text-align:center; color:#9ca3af; margin-top:3rem;">Tu carrito está vacío.</p>'
        $('#cart-total').textContent = '$0.00'
        return
      }

      let total = 0
      $('#cart-items-container').innerHTML = carrito.map((item, idx) => {
        total += item.subtotal
        return `
          <div class="cart-item">
            <div>
              <h4>${item.nombre}</h4>
              <p>Fórmula: <strong>${item.variante}</strong> (Lote: ${item.lote})</p>
              <p>${item.cantidad} unids x $${item.precio.toFixed(2)}</p>
            </div>
            <div style="text-align:right;">
              <strong style="display:block; margin-bottom:0.25rem;">$${item.subtotal.toFixed(2)}</strong>
              <button type="button" data-del-cart="${idx}" style="background:none; border:none; color:#991b1b; font-size:0.75rem; cursor:pointer; text-decoration:underline;">Quitar</button>
            </div>
          </div>
        `
      }).join('')

      $('#cart-total').textContent = `$${total.toFixed(2)}`

      document.querySelectorAll('[data-del-cart]').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.dataset.delCart)
          carrito.splice(idx, 1)
          localStorage.setItem('optiline_cart', JSON.stringify(carrito))
          actualizarBadgeCarrito()
          renderItemsCarrito()
        })
      })
    }

    // Confirmar y Generar Orden en Supabase
    $('#btn-confirmar-pedido').addEventListener('click', async () => {
      if (!carrito.length) return alert('El carrito está vacío.')
      if (!clienteActivo) {
        alert('Debes iniciar sesión con tu cuenta de óptica para confirmar el pedido.')
        window.location.href = 'cuenta.html'
        return
      }

      const total = carrito.reduce((sum, item) => sum + item.subtotal, 0)
      const codPedido = `OPT-${Date.now().toString().slice(-5)}`

      const { data, error } = await supabase.from('pedidos').insert({
        codigo_pedido: codPedido,
        cliente_id: clienteActivo.id,
        total: total,
        monto_pagado: 0.00,
        estado_pago: 'Pendiente',
        estado_despacho: 'En preparación',
        detalles: carrito
      }).select().single()

      if (error) {
        alert('Error al generar pedido: ' + error.message)
        return
      }

      // Vaciar carrito
      carrito = []
      localStorage.removeItem('optiline_cart')
      actualizarBadgeCarrito()
      cerrarDrawerCarrito()

      alert(`✓ ¡Orden #${codPedido} generada con éxito! Puedes reportar tus abonos o pago total en Mi Cuenta.`)
      window.location.href = 'cuenta.html'
    })

    inicializarCatalogo()
  </script>

</body>
</html>
