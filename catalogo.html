<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo Mayorista · Optiline</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <style>
    .header__inner { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .logo { flex-shrink: 0; }
    .logo__img { max-width: 150px; height: auto; object-fit: contain; flex-shrink: 0; }
    .header-tools { display: flex; align-items: center; gap: 0.85rem; }
    
    .btn-carrito-toggle {
      background: none; border: none; cursor: pointer; position: relative;
      display: flex; align-items: center; justify-content: center; color: var(--gris-900); padding: 0.4rem; flex-shrink: 0;
    }
    .btn-carrito-toggle:hover { color: var(--azul); }
    .btn-carrito-toggle svg { width: 24px; height: 24px; }
    
    .carrito-badge {
      position: absolute; top: -3px; right: -3px; background: var(--naranja); color: #fff;
      font-size: 0.7rem; font-weight: 800; width: 18px; height: 18px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }

    .btn-admin-key { display: flex; align-items: center; justify-content: center; color: var(--gris-700); padding: 0.4rem; border-radius: 50%; flex-shrink: 0; }
    .btn-admin-key:hover { color: var(--naranja); background: #fef3c7; }
    .btn-admin-key svg { width: 22px; height: 22px; }

    .grid-catalogo-productos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.5rem;
    }

    .cart-drawer-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999; display: none; }
    .cart-drawer-backdrop.activo { display: block; }
    .cart-drawer {
      position: fixed; top: 0; right: 0; bottom: 0; width: 100%; max-width: 440px; background: #fff;
      z-index: 1000; box-shadow: -4px 0 15px rgba(0,0,0,0.15); transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column;
    }
    .cart-drawer.activo { transform: translateX(0); }
    .cart-drawer__header { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--gris-200); display: flex; justify-content: space-between; align-items: center; }
    .cart-drawer__body { flex-grow: 1; overflow-y: auto; padding: 1.5rem; }
    .cart-item { display: grid; grid-template-columns: 1fr auto; gap: 1rem; padding-bottom: 1rem; margin-bottom: 1rem; border-bottom: 1px solid var(--gris-200); }
    .cart-drawer__footer { padding: 1.5rem; border-top: 1px solid var(--gris-200); background: var(--gris-100); }

    .cart-summary-line { display: flex; justify-content: space-between; font-size: 0.88rem; margin-bottom: 0.4rem; color: #4b5563; }
    .cart-summary-line.total { font-size: 1.15rem; font-weight: 800; color: #111827; border-top: 1px solid #d1d5db; padding-top: 0.6rem; margin-top: 0.6rem; }
    .cart-summary-line.divisa { font-size: 1.2rem; font-weight: 900; color: var(--azul); }

    .modal-backdrop-custom { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 1100; padding: 1rem; }
    .modal-backdrop-custom.activo { display: flex; }
    .modal-box-custom { background: #fff; border-radius: 8px; max-width: 440px; width: 100%; padding: 2rem; }

    @media (max-width: 640px) {
      .logo__img { max-width: 125px; }
      .header-tools { gap: 0.5rem; }
      #nav-btn-cuenta { padding: 0.4rem 0.75rem; font-size: 0.75rem; }
      .grid-catalogo-productos { grid-template-columns: 1fr; gap: 1rem; }
      .catalogo-producto__media { height: 160px; }
      .cart-drawer { max-width: 100%; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="contenedor header__inner">
      <a href="index.html" class="logo">
        <img src="img/logo.png" alt="Optiline" class="logo__img">
      </a>

      <nav class="nav">
        <ul class="nav__lista">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="catalogo.html" class="activo">Catálogo</a></li>
          <li><a href="cuenta.html?tab=pagos" style="color:var(--naranja); font-weight:700;">Notificación de pago</a></li>
        </ul>
      </nav>

      <div class="header-tools">
        <button type="button" class="btn-carrito-toggle" id="btn-abrir-carrito" aria-label="Ver Carrito">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
          <span class="carrito-badge" id="cart-counter">0</span>
        </button>

        <a href="cuenta.html" id="nav-btn-cuenta" class="boton boton--primario">Mi Cuenta</a>

        <a href="admin.html" class="btn-admin-key" title="Panel Administrativo" aria-label="Acceso Administrador">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4"/><path d="m21 2-9.6 9.6"/><circle cx="7.5" cy="15.5" r="5.5"/></svg>
        </a>
      </div>
    </div>
  </header>

  <!-- BANNER -->
  <section class="banner-pagina">
    <div class="contenedor">
      <h1 class="banner-pagina__titulo">Catálogo Mayorista</h1>
      <div class="migas"><a href="index.html">Inicio</a><span>/</span><span>Productos Disponibles</span></div>
    </div>
  </section>

  <!-- CATÁLOGO -->
  <main class="seccion">
    <div class="contenedor">
      <div class="catalogo-toolbar">
        <div class="catalogo-toolbar__right" id="txt-total-productos">Cargando inventario...</div>
        <select class="catalogo-select" id="select-filtro-categoria"><option value="">Todas las Categorías</option></select>
      </div>

      <div class="grid-catalogo-productos" id="grid-catalogo"></div>
    </div>
  </main>

  <!-- DRAWER DEL CARRITO -->
  <div class="cart-drawer-backdrop" id="cart-backdrop"></div>
  <aside class="cart-drawer" id="cart-drawer">
    <div class="cart-drawer__header">
      <h3 style="font-family:var(--fuente-titulos);">Orden de Pedido</h3>
      <button type="button" id="btn-cerrar-carrito" style="background:none; border:none; font-size:1.5rem; cursor:pointer;">&times;</button>
    </div>

    <div class="cart-drawer__body" id="cart-items-container">
      <p style="text-align:center; color:#9ca3af; margin-top:3rem;">Tu carrito está vacío.</p>
    </div>

    <div class="cart-drawer__footer">
      <div style="margin-bottom:1rem;">
        <label style="display:block; font-size:0.8rem; font-weight:700; margin-bottom:0.35rem;">Modalidad de Pago:</label>
        <select id="cart-moneda-pago" style="width:100%; padding:0.65rem; border:1px solid #d1d5db; border-radius:6px; font-size:0.88rem; background:#fff;">
          <option value="Bs">Pago en Bolívares (Pago Móvil / Transferencia)</option>
          <option value="USD">Pago en Divisas (Zelle / Efectivo / Panamá)</option>
        </select>
      </div>

      <div id="cart-breakdown">
        <div class="cart-summary-line"><span>Precio en Bs:</span><span id="txt-subtotal-bs">Bs. 0,00</span></div>
        <div class="cart-summary-line" id="row-descuento-bs" style="display:none; color:#03543f;">
          <span>Menos Descuento en Bs:</span><span id="txt-descuento-bs">- Bs. 0,00</span>
        </div>
        <div class="cart-summary-line total"><span>Total en Bs:</span><span id="txt-total-bs">Bs. 0,00</span></div>
        <div class="cart-summary-line divisa" id="row-total-divisa" style="display:none;">
          <span>Total en Divisa:</span><span id="txt-total-divisa">$0.00</span>
        </div>
      </div>

      <button type="button" class="boton boton--naranja boton--bloque" id="btn-confirmar-pedido" style="margin-top:1.25rem;">
        Confirmar y Notificar Pedido
      </button>
    </div>
  </aside>

  <!-- MODAL: SELECCIÓN DE VARIANTE -->
  <div class="modal-backdrop-custom" id="modal-units">
    <div class="modal-box-custom">
      <h3 id="modal-prod-nombre" style="font-family:var(--fuente-titulos); font-size:1.2rem; font-weight:800; margin-bottom:0.4rem;"></h3>
      <p id="modal-prod-desc" style="font-size:0.85rem; color:var(--gris-700); margin-bottom:1.25rem;"></p>

      <form id="form-add-to-cart">
        <div class="campo">
          <label>Fórmula / Graduación Disponible:</label>
          <select id="modal-select-variante" style="width:100%; padding:0.75rem; border:1px solid var(--gris-200); border-radius:6px;" required>
            <option value="">Selecciona graduación...</option>
          </select>
        </div>

        <div class="campo" style="margin-top:1rem;">
          <label>Cantidad a Ordenar:</label>
          <div style="display:flex; align-items:center; gap:1rem;">
            <input type="number" id="modal-cantidad" min="1" value="1" style="width:120px; padding:0.75rem; border:1px solid var(--gris-200); border-radius:6px;" required>
            <span id="modal-stock-info" style="font-size:0.85rem; font-weight:700; color:var(--azul);"></span>
          </div>
        </div>

        <div style="display:flex; gap:0.75rem; margin-top:2rem;">
          <button type="submit" class="boton boton--primario boton--bloque">Añadir a la Orden</button>
          <button type="button" class="boton boton--contorno" id="btn-modal-cancel" style="border-color:var(--gris-400); color:var(--gris-900);">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- SCRIPT -->
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const SUPABASE_URL = 'https://fdkdzyjrrtuaotiumbym.supabase.co'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZka2R6eWpycnR1YW90aXVtYnltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0MDc1MzAsImV4cCI6MjEwNjk4MzUzMH0.RC_ueLB8le0c95RMemtkQf4Yj-bFTrfYLaAcbdRDbXs'
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    const $ = (s) => document.querySelector(s)

    let carrito = JSON.parse(localStorage.getItem('optiline_cart') || '[]')
    let catalogoProductos = []
    let inventarioReal = []
    let tasaCatalogo = 1000.00
    let tasaBcv = 900.00
    let telefonoWhatsapp = '584120000000'

    // Estado B2B del Cliente
    let clienteActivo = JSON.parse(localStorage.getItem('optiline_cliente') || 'null')
    const esClienteVerificado = clienteActivo && clienteActivo.estado_verificado && !clienteActivo.inactivo

    if (clienteActivo) {
      $('#nav-btn-cuenta').textContent = clienteActivo.empresa || 'Mi Cuenta'
    }

    function formatoBs(monto) {
      return 'Bs. ' + Number(monto).toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
    }

    async function cargarParametrosCambiarios() {
      const { data } = await supabase.from('parametros').select('*').eq('id', 1).maybeSingle()
      if (data) {
        tasaCatalogo = parseFloat(data.tasa_catalogo) || 1000.00
        tasaBcv = parseFloat(data.tasa_bcv) || 900.00
        telefonoWhatsapp = data.telefono_whatsapp || '584120000000'
      }
    }

    async function inicializarCatalogo() {
      await cargarParametrosCambiarios()

      const { data: cats } = await supabase.from('categorias').select('*').order('nombre')
      $('#select-filtro-categoria').innerHTML = '<option value="">Todas las Categorías</option>' + (cats || []).map(c => `<option value="${c.id}">${c.nombre}</option>`).join('')

      const { data: prods } = await supabase.from('productos').select('*, categorias(nombre)').order('id')
      catalogoProductos = prods || []

      const { data: inv } = await supabase.from('inventario_lotes').select('id, stock, variante_id, variantes(id, nombre, producto_id), lotes(codigo_lote, fecha_vencimiento)')
      inventarioReal = inv || []

      actualizarBadgeCarrito()
      renderCatalogo()
    }

    function renderCatalogo() {
      const cId = $('#select-filtro-categoria').value
      const filtrados = catalogoProductos.filter(p => !cId || p.categoria_id == cId)
      $('#txt-total-productos').textContent = `Mostrando ${filtrados.length} productos disponibles`

      $('#grid-catalogo').innerHTML = filtrados.map(p => {
        const itemsInv = inventarioReal.filter(i => i.variantes?.producto_id === p.id)
        const stockTotal = itemsInv.reduce((sum, item) => sum + (item.stock || 0), 0)
        const tieneStock = stockTotal > 0

        const precioBaseUSD = parseFloat(p.precio) || 0.00
        const precioBs = precioBaseUSD * tasaCatalogo

        return `
          <article class="catalogo-producto">
            <div class="catalogo-producto__media">
              ${p.imagen_url ? `<img src="${p.imagen_url}" alt="${p.nombre}">` : '<div style="height:100%; display:grid; place-items:center; color:#9ca3af;">Sin imagen</div>'}
            </div>
            <div class="catalogo-producto__cuerpo">
              <h3 class="catalogo-producto__titulo">${p.nombre}</h3>
              <p class="catalogo-producto__precio-desc">${p.categorias?.nombre || 'General'}</p>
              
              <!-- PROTECCIÓN B2B DE PRECIOS Y STOCK -->
              ${esClienteVerificado ? `
                <div style="margin: 0.5rem 0;">
                  ${tieneStock ? `
                    <span style="font-size:0.8rem; font-weight:700; color:#03543f; background:#def7ec; padding:0.2rem 0.5rem; border-radius:4px; display:inline-block;">
                      Stock: ${stockTotal} unids
                    </span>
                  ` : `
                    <span style="font-size:0.8rem; font-weight:700; color:#991b1b; background:#fee2e2; padding:0.2rem 0.5rem; border-radius:4px; display:inline-block;">
                      Agotado (0 unids)
                    </span>
                  `}
                </div>
                <div class="catalogo-producto__precio">${formatoBs(precioBs)}</div>
              ` : `
                <div style="margin: 0.8rem 0; font-size:0.85rem; color:#64748b; font-style:italic;">
                  Precios mayoristas protegidos
                </div>
              `}
            </div>

            ${esClienteVerificado ? `
              <button type="button" 
                class="catalogo-producto__opciones ${tieneStock ? 'catalogo-producto__opciones--destacado' : ''}" 
                data-abrir-prod="${p.id}"
                ${!tieneStock ? 'disabled style="opacity:0.5; cursor:not-allowed;"' : ''}>
                ${tieneStock ? 'Seleccionar Unidades' : 'Sin Stock'}
              </button>
            ` : `
              <a href="index.html#registro" class="catalogo-producto__opciones" style="display:block; text-align:center; background:#0b4d8c; color:#fff;">
                Ver Precios (Requiere Registro)
              </a>
            `}
          </article>
        `
      }).join('')

      document.querySelectorAll('[data-abrir-prod]').forEach(btn => {
        btn.addEventListener('click', () => abrirModalUnidades(parseInt(btn.dataset.abrirProd)))
      })
    }

    $('#select-filtro-categoria').addEventListener('change', renderCatalogo)

    // Modal Selección Unidades
    let productoActualModal = null, itemsDisponiblesModal = []
    function abrirModalUnidades(pId) {
      productoActualModal = catalogoProductos.find(p => p.id === pId)
      if (!productoActualModal) return

      itemsDisponiblesModal = inventarioReal.filter(i => i.variantes?.producto_id === pId && i.stock > 0)
      $('#modal-prod-nombre').textContent = productoActualModal.nombre
      $('#modal-prod-desc').textContent = productoActualModal.descripcion || 'Selecciona graduación y cantidad.'

      $('#modal-select-variante').innerHTML = '<option value="">Selecciona graduación...</option>' +
        itemsDisponiblesModal.map(i => `
          <option value="${i.id}" data-stock="${i.stock}">
            ${i.variantes?.nombre} (Lote: ${i.lotes?.codigo_lote} | Disp: ${i.stock} unids)
          </option>
        `).join('')

      $('#modal-cantidad').value = '1'
      $('#modal-stock-info').textContent = ''
      $('#modal-units').classList.add('activo')
    }

    $('#modal-select-variante').addEventListener('change', (e) => {
      const opt = e.target.selectedOptions[0]
      if (opt && opt.value) {
        const sMax = parseInt(opt.dataset.stock)
        $('#modal-cantidad').max = sMax
        $('#modal-stock-info').textContent = `Máximo: ${sMax} unids`
      } else {
        $('#modal-stock-info').textContent = ''
      }
    })

    $('#btn-modal-cancel').addEventListener('click', () => $('#modal-units').classList.remove('activo'))

    $('#form-add-to-cart').addEventListener('submit', (e) => {
      e.preventDefault()
      const invId = parseInt($('#modal-select-variante').value)
      const cant = parseInt($('#modal-cantidad').value)
      const itemInv = itemsDisponiblesModal.find(i => i.id === invId)
      if (!itemInv || cant <= 0 || cant > itemInv.stock) return alert('Selecciona cantidad válida.')

      const precioBaseUSD = parseFloat(productoActualModal.precio || 0)

      carrito.push({
        invId: itemInv.id,
        productoId: productoActualModal.id,
        nombre: productoActualModal.nombre,
        variante: itemInv.variantes?.nombre,
        lote: itemInv.lotes?.codigo_lote,
        cantidad: cant,
        precioUSD: precioBaseUSD
      })

      localStorage.setItem('optiline_cart', JSON.stringify(carrito))
      actualizarBadgeCarrito()
      $('#modal-units').classList.remove('activo')
      abrirDrawerCarrito()
    })

    function actualizarBadgeCarrito() {
      $('#cart-counter').textContent = carrito.reduce((sum, item) => sum + item.cantidad, 0)
    }

    function abrirDrawerCarrito() {
      $('#cart-backdrop').classList.add('activo')
      $('#cart-drawer').classList.add('activo')
      renderCarrito()
    }

    function cerrarDrawerCarrito() {
      $('#cart-backdrop').classList.remove('activo')
      $('#cart-drawer').classList.remove('activo')
    }

    $('#btn-abrir-carrito').addEventListener('click', abrirDrawerCarrito)
    $('#btn-cerrar-carrito').addEventListener('click', cerrarDrawerCarrito)
    $('#cart-backdrop').addEventListener('click', cerrarDrawerCarrito)
    $('#cart-moneda-pago').addEventListener('change', renderCarrito)

    function renderCarrito() {
      if (!carrito.length) {
        $('#cart-items-container').innerHTML = '<p style="text-align:center; color:#9ca3af; margin-top:3rem;">Tu carrito está vacío.</p>'
        $('#txt-subtotal-bs').textContent = formatoBs(0)
        $('#txt-total-bs').textContent = formatoBs(0)
        $('#row-descuento-bs').style.display = 'none'
        $('#row-total-divisa').style.display = 'none'
        return
      }

      const moneda = $('#cart-moneda-pago').value
      let totalUSD = 0

      $('#cart-items-container').innerHTML = carrito.map((item, idx) => {
        const itemTotalUSD = item.cantidad * item.precioUSD
        totalUSD += itemTotalUSD
        const itemPrecioBs = item.precioUSD * tasaCatalogo

        return `
          <div class="cart-item">
            <div>
              <h4 style="font-family:var(--fuente-titulos);">${item.nombre}</h4>
              <p>Fórmula: <strong>${item.variante}</strong></p>
              <p>${item.cantidad} unids x ${formatoBs(itemPrecioBs)}</p>
            </div>
            <div style="text-align:right;">
              <strong style="display:block; margin-bottom:0.25rem;">${formatoBs(itemTotalUSD * tasaCatalogo)}</strong>
              <button type="button" data-del-cart="${idx}" style="background:none; border:none; color:#991b1b; font-size:0.75rem; cursor:pointer; text-decoration:underline;">Quitar</button>
            </div>
          </div>
        `
      }).join('')

      const subtotalBs = totalUSD * tasaCatalogo

      if (moneda === 'USD') {
        const totalBsCompensado = totalUSD * tasaBcv
        const descuentoBs = subtotalBs - totalBsCompensado

        $('#row-descuento-bs').style.display = 'flex'
        $('#row-total-divisa').style.display = 'flex'

        $('#txt-subtotal-bs').textContent = formatoBs(subtotalBs)
        $('#txt-descuento-bs').textContent = '- ' + formatoBs(descuentoBs)
        $('#txt-total-bs').textContent = formatoBs(totalBsCompensado)
        $('#txt-total-divisa').textContent = `$${totalUSD.toFixed(2)}`
      } else {
        $('#row-descuento-bs').style.display = 'none'
        $('#row-total-divisa').style.display = 'none'

        $('#txt-subtotal-bs').textContent = formatoBs(subtotalBs)
        $('#txt-total-bs').textContent = formatoBs(subtotalBs)
      }

      document.querySelectorAll('[data-del-cart]').forEach(btn => {
        btn.addEventListener('click', () => {
          carrito.splice(parseInt(btn.dataset.delCart), 1)
          localStorage.setItem('optiline_cart', JSON.stringify(carrito))
          actualizarBadgeCarrito()
          renderCarrito()
        })
      })
    }

    // ================= CONFIRMAR PEDIDO, DEDUCIR STOCK Y DISPARAR WHATSAPP =================
    $('#btn-confirmar-pedido').addEventListener('click', async () => {
      if (!carrito.length) return alert('El carrito está vacío.')

      if (!esClienteVerificado) {
        alert('Debes iniciar sesión con una cuenta de óptica verificada para confirmar el pedido.')
        window.location.href = 'cuenta.html'
        return
      }

      const btn = $('#btn-confirmar-pedido')
      btn.disabled = true
      btn.textContent = 'Procesando orden y stock...'

      try {
        // 1. Deducir stock atómicamente de inventario_lotes
        for (const item of carrito) {
          const { data: invItem, error: errFetch } = await supabase
            .from('inventario_lotes')
            .select('id, stock')
            .eq('id', item.invId)
            .single()

          if (errFetch || !invItem || invItem.stock < item.cantidad) {
            throw new Error(`Stock insuficiente para ${item.nombre} (${item.variante}).`)
          }

          const { error: errUpdate } = await supabase
            .from('inventario_lotes')
            .update({ stock: invItem.stock - item.cantidad })
            .eq('id', item.invId)

          if (errUpdate) throw errUpdate
        }

        // 2. Registrar orden
        const moneda = $('#cart-moneda-pago').value
        const totalUSD = carrito.reduce((sum, item) => sum + (item.cantidad * item.precioUSD), 0)
        const subtotalBs = totalUSD * tasaCatalogo
        const totalBs = moneda === 'USD' ? (totalUSD * tasaBcv) : subtotalBs
        const descuentoBs = moneda === 'USD' ? (subtotalBs - totalBs) : 0.00
        const codPedido = `OPT-${Date.now().toString().slice(-5)}`
        const totalFinal = moneda === 'USD' ? totalUSD : totalBs

        const { error: errPed } = await supabase.from('pedidos').insert({
          codigo_pedido: codPedido,
          cliente_id: clienteActivo.id,
          total: totalFinal,
          moneda_pago: moneda === 'USD' ? 'USD' : 'Bs.',
          subtotal_bs: subtotalBs,
          descuento_bs: descuentoBs,
          total_bs: totalBs,
          total_usd: totalUSD,
          monto_pagado: 0.00,
          estado_pago: 'Pendiente',
          estado_despacho: 'En preparación',
          detalles: carrito
        })

        if (errPed) throw errPed

        // 3. Actualizar fecha de última compra para regla de inactividad
        await supabase.from('clientes').update({ ultima_compra: new Date().toISOString() }).eq('id', clienteActivo.id)

        // 4. Armar mensaje de WhatsApp pre-estructurado
        let listaTexto = carrito.map(i => `• ${i.cantidad}x ${i.nombre} [${i.variante}]`).join('\n')
        let totalTexto = moneda === 'USD' ? `$${totalFinal.toFixed(2)}` : formatoBs(totalFinal)

        const mensajeWapp = 
`*NUEVA ORDEN WEB - OPTILINE*
*Orden:* #${codPedido}
*Cliente:* ${clienteActivo.empresa} (${clienteActivo.rif})
*Modalidad:* Pago en ${moneda === 'USD' ? 'Divisas (USD)' : 'Bolívares (Bs.)'}

*Detalle de Ítems:*
${listaTexto}

*Total a Pagar:* ${totalTexto}

_Quedo a la espera de confirmación de despacho._`

        // 5. Vaciar carrito
        carrito = []
        localStorage.removeItem('optiline_cart')
        actualizarBadgeCarrito()
        cerrarDrawerCarrito()

        // 6. Abrir WhatsApp automáticamente con el teléfono configurado
        const urlWapp = `https://wa.me/${telefonoWhatsapp}?text=${encodeURIComponent(mensajeWapp)}`
        window.open(urlWapp, '_blank')

        alert(`✓ ¡Orden #${codPedido} generada exitosamente!\nSe ha abierto WhatsApp para que envíes el resumen directo al equipo de ventas.`)
        window.location.href = 'cuenta.html'

      } catch (err) {
        alert('Error: ' + err.message)
      } finally {
        btn.disabled = false
        btn.textContent = 'Confirmar y Notificar Pedido'
      }
    })

    inicializarCatalogo()
  </script>

</body>
</html>
